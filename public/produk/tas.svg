    <path d="M199 289h202M195 326h197m-202 37h192m-197 37h187" stroke="#e5c986" stroke-width="12"/>
    <path d="M230 256v190m39-190v197m40-197v199m40-199v196m39-196v190" stroke="#9b7542" stroke-width="11"/>
    <path d="M196 252h208" stroke="#795735" stroke-width="15"/>
