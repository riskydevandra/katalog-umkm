<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi animasi tas anyaman</title>
  <desc id="desc">Tas pandan dengan pola anyaman yang bergoyang lembut.</desc>
  <style>
    .bag { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 15%; }
    .strap { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
  <rect width="600" height="600" rx="36" fill="#e8efdf"/>
  <circle cx="300" cy="275" r="205" fill="#f8fbf2"/>
